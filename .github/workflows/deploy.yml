name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy production
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${VM_HOST:?VM_HOST secret is required}"
          : "${VM_USER:?VM_USER secret is required}"
          : "${VM_SSH_KEY:?VM_SSH_KEY secret is required}"
          : "${VM_KNOWN_HOSTS:?VM_KNOWN_HOSTS secret is required}"

          key_path="$RUNNER_TEMP/deploy_key"
          known_hosts_path="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key_path" "$known_hosts_path"' EXIT

          umask 077
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > "$key_path"
          printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_path"

          ssh \
            -i "$key_path" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_path" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$VM_USER@$VM_HOST" \
            'umask 077
          deploy_script=$(mktemp)
          trap "rm -f \"$deploy_script\"" EXIT
          cat > "$deploy_script"
          bash "$deploy_script"' <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd /home/ubuntu/predict-the-ball
          git pull --ff-only origin main

          cd frontend
          npm ci
          VITE_API_URL=https://api.predict-the-ball.atredshaw.com npm run build

          cd /home/ubuntu/predict-the-ball
          docker compose build predict-the-ball
          docker compose run --rm --interactive=false predict-the-ball flask --app app:create_app db upgrade
          docker compose up -d predict-the-ball

          sudo mkdir -p /var/www/predict-the-ball
          sudo rsync -a --delete frontend/dist/ /var/www/predict-the-ball/
          sudo chown -R www-data:www-data /var/www/predict-the-ball

          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE_SCRIPT
