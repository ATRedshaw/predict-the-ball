name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/predict-the-ball
            git pull --ff-only origin main

            cd frontend
            npm ci
            VITE_API_URL=https://api.predict-the-ball.atredshaw.com npm run build

            cd /home/ubuntu/predict-the-ball
            docker compose build predict-the-ball
            docker compose run --rm predict-the-ball flask --app app:create_app db upgrade
            docker compose up -d predict-the-ball

            sudo mkdir -p /var/www/predict-the-ball
            sudo rsync -a --delete frontend/dist/ /var/www/predict-the-ball/
            sudo chown -R www-data:www-data /var/www/predict-the-ball

            sudo nginx -t
            sudo systemctl reload nginx
