elo:
  # Starting rating assigned to every team before they play their first match.
  # 1500 is the conventional ELO baseline and should not normally need changing.
  initial_rating: 1500.0

  # Number of seasons held back from the end of the dataset for validation.
  # These seasons are never used to drive optimisation — only to measure it.
  # Increase this for a more conservative estimate of out-of-sample performance;
  # decrease it if you have very few seasons of data.
  n_val_seasons: 3

  # Small constant added/subtracted before taking log in the loss function.
  # Prevents log(0) when a prediction is exactly 0 or 1.
  log_loss_clip: 1.0e-7

optimisation:
  # Random seed passed to differential_evolution for reproducibility.
  seed: 104

  # Population size multiplier. The actual population is popsize * n_parameters
  # individuals. Larger values explore the space more thoroughly but cost more
  # function evaluations. 12 is a reasonable default for 4 parameters.
  popsize: 12

  # Maximum number of generations before the optimiser gives up.
  maxiter: 200

  # Convergence tolerance on the population's standard deviation relative to
  # its mean. Once the population is this tight, optimisation stops early.
  tol: 1.0e-4

  # Mutation constant range [min, max]. Controls how aggressively new candidate
  # solutions differ from existing ones. Wider range = more exploration.
  mutation_min: 0.5
  mutation_max: 1.0

  # Crossover probability. Higher values mix more parameters from the donor
  # vector into the trial vector, increasing diversity.
  recombination: 0.7

  # If true, runs a final L-BFGS-B local search over the best solution found
  # by differential_evolution to tighten the result.
  polish: true

  # How often (in generations) progress is logged.
  log_every_n_generations: 10

# Search bounds for each tuned parameter. The optimiser will not look outside
# these ranges, so set them wide enough to include any plausible value.
bounds:
  # Base K-factor: controls how much ratings shift after each match.
  # Lower = slower, more stable ratings. Higher = ratings react faster to results.
  # Typical football ELO systems use values between 20 and 40.
  k_base:
    min: 10.0
    max: 60.0

  # Home field advantage in ELO rating points added to the home team before
  # computing win probability. A value of ~40 points corresponds to roughly a
  # 6% boost in win probability for an evenly matched fixture.
  home_advantage:
    min: 0.0
    max: 120.0

  # Weight applied to the margin-of-victory multiplier ln(|goal_diff| + 1).
  # At 0.0 every result is treated identically regardless of the score.
  # At 1.0 the full log-scaled goal difference is applied to the K-factor.
  # Values above 1.0 amplify it further.
  mov_weight:
    min: 0.0
    max: 1.5

  # Off-season mean reversion: fraction of each team's deviation from
  # initial_rating that is pulled back at the start of each new season.
  # 0.0 = ratings carry over unchanged. 0.5 = half the deviation is erased.
  # Useful if squad turnover makes prior-season ratings a poor predictor.
  reversion:
    min: 0.0
    max: 0.6
